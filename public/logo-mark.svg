<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="scGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="scGradSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="scGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="scShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Tech Circuit Node Ring -->
  <circle cx="60" cy="60" r="54" stroke="url(#scGradSecondary)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Modern Geometric Rounded Hexagon / Diamond Shield -->
  <rect x="22" y="22" width="76" height="76" rx="22" fill="none" stroke="url(#scGradPrimary)" stroke-width="3" filter="url(#scShadow)" />
  <rect x="28" y="28" width="64" height="64" rx="18" fill="url(#scGlow)" opacity="0.15" />

  <!-- Flow & Automation Nodes -->
  <circle cx="34" cy="34" r="4" fill="#38bdf8" />
  <circle cx="86" cy="34" r="4" fill="#a855f7" />
  <circle cx="86" cy="86" r="4" fill="#10b981" />
  <circle cx="34" cy="86" r="4" fill="#38bdf8" />

  <!-- Stylized Monogram "S" & "C" Path -->
  <!-- "S" Top & Central Loop -->
  <path d="M 76 44 C 76 37 44 34 44 48 C 44 60 76 60 76 72 C 76 86 44 83 44 76" 
        stroke="url(#scGradPrimary)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- "C" Surrounding Arc Accent -->
  <path d="M 68 34 C 84 40 88 56 88 60 C 88 74 78 84 64 86" 
        stroke="url(#scGradSecondary)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Center Core Fusion Spark -->
  <circle cx="60" cy="60" r="3.5" fill="#ffffff" filter="url(#scShadow)" />
</svg>
