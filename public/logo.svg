<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Logo Mark Emblem on Left (60x60 centered in 70 height) -->
  <g transform="translate(5, 5)">
    <!-- Outer Shield -->
    <rect x="2" y="2" width="56" height="56" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="url(#logoGrad)" stroke-width="2.5" filter="url(#logoGlow)" />
    
    <!-- Accent Nodes -->
    <circle cx="12" cy="12" r="2.5" fill="#38bdf8" />
    <circle cx="48" cy="12" r="2.5" fill="#a855f7" />
    <circle cx="48" cy="48" r="2.5" fill="#10b981" />
    <circle cx="12" cy="48" r="2.5" fill="#38bdf8" />

    <!-- "S" & "C" Path -->
    <path d="M 38 18 C 38 13 22 11 22 22 C 22 31 38 31 38 40 C 38 50 22 47 22 42" 
          stroke="url(#logoGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <path d="M 33 13 C 43 17 45 28 45 30 C 45 40 40 47 31 48" 
          stroke="url(#logoAccent)" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.8" />
          
    <circle cx="30" cy="30" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography: Brand Name -->
  <text x="75" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5px" fill="#ffffff">
    SuPuja <tspan fill="#38bdf8">Creations</tspan>
  </text>
  
  <!-- Subtitle: Enterprise Automation -->
  <text x="76" y="54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5px" fill="#94a3b8" text-transform="uppercase">
    ENTERPRISE BUSINESS AUTOMATION
  </text>
</svg>
